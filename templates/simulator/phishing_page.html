<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Landing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/simulator.css') }}">
</head>
<body>
    <main class="simulator-main">
        <section class="simulation-controls">
            <div class="container">
                <div class="control-panel">
                    <h2>Phishing Landing Page</h2>
                    <p class="stat-label">This page records click events for analytics.</p>
                    <form method="POST" action="/submit-credentials">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" name="username" />
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" />
                        </div>
                        <button class="btn" type="submit">Submit</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
